<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Background Luxury Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2234" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    
    <!-- Primary Gold/Amber Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="35%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Film Ribbon Gradient -->
    <linearGradient id="filmGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#EA580C" />
      <stop offset="100%" stop-color="#DC2626" />
    </linearGradient>

    <!-- Page White/Cream Gradients -->
    <linearGradient id="pageGradLeft" x1="100%" y1="50%" x2="0%" y2="50%">
      <stop offset="0%" stop-color="#DDD2BF" />
      <stop offset="40%" stop-color="#FAF5EB" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <linearGradient id="pageGradRight" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#DDD2BF" />
      <stop offset="40%" stop-color="#FAF5EB" />
      <stop offset="100%" stop-color="#FFFFFF" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="logoShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base Frame -->
  <rect x="4" y="4" width="92" height="92" rx="24" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5" filter="url(#logoShadow)" />
  
  <!-- Subtle Inner Border -->
  <rect x="7.5" y="7.5" width="85" height="85" rx="21" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="1" />

  <!-- Ambient Glow Behind Core -->
  <circle cx="50" cy="50" r="26" fill="#F59E0B" opacity="0.18" filter="url(#goldGlow)" />

  <!-- ── BOOK BASE (Open Pages) ── -->
  <!-- Hardcover Base Border -->
  <path d="M 18 68 Q 50 63 50 78 Q 50 63 82 68 L 84 72 Q 50 67 50 82 Q 50 67 16 72 Z" fill="#92400E" opacity="0.9" />

  <!-- Left Open Page Stack -->
  <path d="M 20 65 Q 35 60 50 64 L 50 75 Q 35 71 20 75 Z" fill="#D4C5A9" />
  <path d="M 21 62 Q 35 57 50 61 L 50 73 Q 35 69 21 73 Z" fill="url(#pageGradLeft)" />

  <!-- Right Open Page Stack -->
  <path d="M 80 65 Q 65 60 50 64 L 50 75 Q 65 71 80 75 Z" fill="#D4C5A9" />
  <path d="M 79 62 Q 65 57 50 61 L 50 73 Q 65 69 79 73 Z" fill="url(#pageGradRight)" />

  <!-- Center Spine Fold Line -->
  <line x1="50" y1="58" x2="50" y2="76" stroke="#78350F" stroke-width="1.8" stroke-linecap="round" />

  <!-- ── CINEMATIC FILM REEL STRIP ── -->
  <path d="M 48 62 C 45 46, 26 44, 28 32 C 30 20, 52 18, 64 24 C 74 29, 78 40, 70 46 C 62 52, 52 48, 51 40" 
        fill="none" stroke="#111827" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
  <path d="M 48 62 C 45 46, 26 44, 28 32 C 30 20, 52 18, 64 24 C 74 29, 78 40, 70 46 C 62 52, 52 48, 51 40" 
        fill="none" stroke="url(#filmGrad)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Film Strip Center Track -->
  <path d="M 48 62 C 45 46, 26 44, 28 32 C 30 20, 52 18, 64 24 C 74 29, 78 40, 70 46 C 62 52, 52 48, 51 40" 
        fill="none" stroke="#0B0F19" stroke-width="3" stroke-linecap="round" stroke-dasharray="3.5 2" />

  <!-- Film Sprocket Dots -->
  <circle cx="30" cy="27" r="1.1" fill="#FEF3C7" />
  <circle cx="36" cy="22" r="1.1" fill="#FEF3C7" />
  <circle cx="44" cy="20" r="1.1" fill="#FEF3C7" />
  <circle cx="53" cy="21" r="1.1" fill="#FEF3C7" />
  <circle cx="62" cy="24" r="1.1" fill="#FEF3C7" />
  <circle cx="70" cy="30" r="1.1" fill="#FEF3C7" />
  <circle cx="73" cy="38" r="1.1" fill="#FEF3C7" />
  <circle cx="68" cy="45" r="1.1" fill="#FEF3C7" />

  <!-- ── RADIANT STORY SPARKLE AT APEX ── -->
  <g transform="translate(74, 20)">
    <path d="M 0 -7 Q 1 -1 7 0 Q 1 1 0 7 Q -1 1 -7 0 Q -1 -1 0 -7 Z" fill="url(#goldGrad)" filter="url(#goldGlow)" />
    <circle cx="0" cy="0" r="1.5" fill="#FFFFFF" />
  </g>

  <!-- Secondary Tiny Sparkle -->
  <g transform="translate(23, 40)">
    <path d="M 0 -4 Q 0.6 -0.6 4 0 Q 0.6 0.6 0 4 Q -0.6 0.6 -4 0 Q -0.6 -0.6 0 -4 Z" fill="#FDE68A" />
  </g>
</svg>